name: Supabase despierto

on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://ihsziuubwukxndryxaxn.supabase.co
      SUPABASE_KEY: sb_publishable_gVJotWDy5kcmBchuG3YR-A_HvVw_uS6
      TABLA: products
      COLUMNA: id
    steps:
      - name: Consulta a la base
        run: |
          code=$(curl -s -o respuesta.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/$TABLA?select=$COLUMNA&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Respuesta de Supabase: $code"
          head -c 200 respuesta.json; echo
          test "$code" = "200"
