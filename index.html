<!doctype html>

<html lang="es-AR">

  <head>

    <meta charset="UTF-8" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fuentes: cargadas desde el head (más rápido que @import en el CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
    />

    <!-- Hero: se piden antes de que cargue React -->
    <link rel="preload" as="image" href="/dulce-abril-hero-bg.webp" type="image/webp" />
    <link rel="preload" as="image" href="/dulce-abril-logo.webp" type="image/webp" fetchpriority="high" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link
  rel="canonical"
  href="https://www.dulceabril.com.ar/"
/>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="color-scheme" content="light" />

    <meta
      name="description"
      content="Dulce Abril — Mates, termos, tazas y combos. Descubrí nuestros productos y realizá tu pedido de manera rápida y sencilla."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <!-- Open Graph: vista previa al compartir la tienda -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Dulce Abril | Mates, Termos, Tazas y Combos" />
    <meta
      property="og:description"
      content="Descubrí los productos de Dulce Abril: mates, termos, tazas y combos."
    />
    <meta property="og:url" content="https://www.dulceabril.com.ar/" />
    <meta property="og:site_name" content="Dulce Abril" />
    <meta property="og:image" content="https://www.dulceabril.com.ar/dulce-abril-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dulce Abril — Tienda de Ideas" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Dulce Abril | Mates, Termos, Tazas y Combos"
    />
    <meta
      name="twitter:description"
      content="Descubrí los productos de Dulce Abril y realizá tu pedido."
    />
    <meta name="twitter:image" content="https://www.dulceabril.com.ar/dulce-abril-og.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Dulce Abril",
        "url": "https://www.dulceabril.com.ar/",
        "logo": "https://www.dulceabril.com.ar/dulce-abril-logo.png",
        "description": "Tienda online de mates, termos, tazas y combos de Dulce Abril.",
        "inLanguage": "es-AR"
      }
    </script>

    <title>Dulce Abril | Mates, Termos, Tazas y Combos</title>

  </head>

  <body>

    <div id="root"></div>

    <noscript>
      <p style="font-family: Georgia, serif; text-align: center; padding: 40px 20px;">
        Dulce Abril — Mates, termos, tazas y combos. Para ver la tienda necesitás activar JavaScript.
      </p>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>

  </body>

</html>
